[project]
name = "sysyst"
version = "0.1.0"
description = "Desktop pipeline for LLM-assisted systematic literature reviews and meta-analysis"
readme = "README.md"
license = "MPL-2.0"
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: Mozilla Public License 2.0 (MPL 2.0)",
]
dependencies = [
    "anthropic>=0.20",
    "beautifulsoup4>=4.12",
    "httpx>=0.24",
    "matplotlib>=3.7",
    "networkx>=3.1",
    "numpy>=1.24",
    "openai>=1.0",
    "pandas>=2.0",
    "PyMuPDF>=1.23",
    "PyPDF2>=3.0",
    "PySide6>=6.5",
    "python-louvain>=0.16",
    "pyyaml>=6.0",
    "rapidfuzz>=3.0",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "sentence-transformers>=2.2",
    "tomotopy>=0.13",
]

[project.optional-dependencies]
rag = ["paper-qa>=5.0"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
